spring.application.name=Backend

# --- Datasource (override via env vars in real deployments) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/swiftserve_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:shlok6123}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- JWT ---
# Override jwt.secret via env var JWT_SECRET in any non-dev environment.
jwt.secret=${JWT_SECRET:your_very_long_and_very_secure_secret_key_for_swiftserve}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- DriverService microservice ---
swiftserve.driver-service.base-url=${DRIVER_SERVICE_URL:http://localhost:8081}
